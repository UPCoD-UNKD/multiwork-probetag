version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./multiwork-backend
      dockerfile: Dockerfile
    container_name: multiwork-backend
    restart: always
    env_file:
      - .env.production
    #      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: production
      # DB Connection injected from .env.production
      # using env_file handles APP_JWT_SECRET automatically
      SERVER_PORT: 8080
      SPRING_REDIS_HOST: redis
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - internal-net

  # Frontend Service (Nginx + Static Files)
  frontend:
    build:
      context: ./multiwork-frontend
      dockerfile: Dockerfile
      args:
        # Empty string to prevent double /api/api prefix (defaults to /api in Dockerfile)
        - REACT_APP_API_URL=
    container_name: multiwork-frontend
    restart: always
    #    ports:
    #      # Expose for direct testing at port 8081
    #      - "8081:80"
    networks:
      - internal-net

  # Nginx Reverse Proxy (Gateway)
  nginx:
    image: nginx:alpine
    container_name: multiwork-gateway
    ports:
      - "80:80"
      # Secure port if certificates are added later
      # - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment to mount SSL certificates
      # - ./certbot/conf:/etc/letsencrypt/:ro
      # - ./certbot/www:/var/www/certbot/:ro
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - internal-net

  # Redis Service (Cache)
  redis:
    image: redis:alpine
    container_name: multiwork-redis
    restart: always
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge
