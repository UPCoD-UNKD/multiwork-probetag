# Test configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT test configuration (must match main application.properties format)
app.jwtSecret=testSecretKeyForJWTTokenGeneration12345678901234567890
app.jwtExpirationMs=86400000

# CORS test configuration
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=*
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Disable security for easier testing (can be overridden in specific tests)
spring.security.user.name=testuser
spring.security.user.password=testpass

# Disable H2 console in tests
spring.h2.console.enabled=false
