<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Серый фон с легким градиентом -->
  <rect width="120" height="120" rx="12" fill="#2A2A2A"/>
  <rect width="120" height="120" rx="12" fill="url(#gradient)" opacity="0.3"/>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="120" y2="120">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
  </defs>
  
  <!-- Иконка фотоаппарата -->
  <g transform="translate(30, 30)">
    <!-- Корпус фотоаппарата -->
    <rect x="15" y="20" width="40" height="30" rx="4" fill="#4A4A4A" stroke="#6A6A6A" stroke-width="2"/>
    
    <!-- Объектив (внешнее кольцо) -->
    <circle cx="35" cy="35" r="12" fill="#1A1A1A" stroke="#6A6A6A" stroke-width="2"/>
    <!-- Объектив (внутреннее кольцо) -->
    <circle cx="35" cy="35" r="8" fill="#2A2A2A"/>
    <!-- Объектив (центр) -->
    <circle cx="35" cy="35" r="4" fill="#1A1A1A"/>
    
    <!-- Вспышка -->
    <rect x="42" y="22" width="8" height="5" rx="1.5" fill="#6A6A6A"/>
    
    <!-- Верхняя часть (видоискатель) -->
    <rect x="18" y="15" width="34" height="8" rx="3" fill="#4A4A4A" stroke="#6A6A6A" stroke-width="2"/>
    
    <!-- Видоискатель (окошко) -->
    <rect x="22" y="18" width="10" height="5" rx="1" fill="#1A1A1A"/>
  </g>
  
  <!-- Иконка плюса (намек на загрузку) -->
  <g transform="translate(90, 90)">
    <circle cx="0" cy="0" r="8" fill="#4ED9EC" opacity="0.8"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
